server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /diyanet/ {
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://namazvakitleri.diyanet.gov.tr/;
        proxy_set_header Host namazvakitleri.diyanet.gov.tr;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; VakitPWA)";
        proxy_set_header Accept "text/html,application/json";
        proxy_ssl_server_name on;
        proxy_ssl_name namazvakitleri.diyanet.gov.tr;
        proxy_hide_header Set-Cookie;
        proxy_intercept_errors on;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/manifest+json;
}
